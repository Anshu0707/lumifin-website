<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/lumifin_logo.svg" />
    <title>Lumifin — Pay Like a Local</title>
    <meta name="description" content="Seamlessly navigate South East Asia and beyond with instant QR payments. Redefining travel with zero hidden fees." />

    <!-- Open Graph / Facebook / WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.lumifin.io" />
    <meta property="og:title" content="Lumifin — Pay Like a Local" />
    <meta property="og:description" content="Seamlessly navigate South East Asia and beyond with instant QR payments. Redefining travel with zero hidden fees." />
    <meta property="og:image" content="https://www.lumifin.io/assets/preview/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://www.lumifin.io" />
    <meta name="twitter:title" content="Lumifin — Pay Like a Local" />
    <meta name="twitter:description" content="Seamlessly navigate South East Asia and beyond with instant QR payments. Redefining travel with zero hidden fees." />
    <meta name="twitter:image" content="https://www.lumifin.io/assets/preview/og-image.jpg" />

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <!-- Hidden form for Netlify bot detection (React SPA requirement) -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
