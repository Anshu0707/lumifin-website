<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fonts self-hosted via @fontsource -->

    <!-- Per-page <title>, <meta description>, <link rel="canonical">, OG and Twitter tags
         are injected per route via the <SEO> component (react-helmet-async) and baked
         into static HTML at build time by scripts/prerender.mjs. Do not hardcode them here. -->

    <!-- Bing Webmaster Tools site verification -->
    <meta name="msvalidate.01" content="480B8518689063A784BC8D318BC0DBA5" />

    <!-- Google Analytics 4 (Consent Mode v2 — denied by default until user accepts).
         Tracking is unlocked client-side by src/components/CookieConsent.tsx. -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HL959CHRBM"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      gtag('config', 'G-HL959CHRBM');
    </script>
  </head>
  <body>
    <!-- Hidden forms for Netlify bot detection (React SPA requirement) -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
    </form>
    <form name="beta-application" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="fullName" />
      <input name="email" type="email" />
      <input name="whatsapp" />
      <input name="country" />
      <input name="nationality" />
      <input name="sepa" />
      <input name="vietnamStatus" />
      <input name="phoneOs" />
      <input name="appStoreEmail" type="email" />
      <input name="discovered" />
      <input name="discoveredGroup" />
      <input name="usedQr" />
      <input name="commit" />
      <input name="consentRequired" />
      <input name="consentMarketing" />
      <input name="utm_source" />
      <input name="utm_medium" />
      <input name="utm_campaign" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
