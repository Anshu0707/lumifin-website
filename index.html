<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <!-- Fonts self-hosted via @fontsource -->

    <!-- Per-page <title>, <meta description>, <link rel="canonical">, OG and Twitter tags
         are injected per route via the <SEO> component (react-helmet-async) and baked
         into static HTML at build time by scripts/prerender.mjs. Do not hardcode them here. -->

    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
  </head>
  <body>
    <!-- Hidden form for Netlify bot detection (React SPA requirement) -->
    <form name="waitlist" netlify netlify-honeypot="bot-field" hidden>
      <input name="bot-field" />
      <input name="email" type="email" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
